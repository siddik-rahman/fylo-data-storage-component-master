<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fylo-data-storage-component-master</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital@400;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-blue-950 flex min-h-screen justify-center items-center font-sans ">
    <main class="mx-6 w-full max-w-4xl flex flex-col  md:flex-row md:items-end gap-4 md:gap-8 py-25 px-6  bg-[url('/images/bg-mobile.png')] md:bg-[url('/images/bg-desktop.png')] bg-no-repeat bg-cover bg-center">
      <section class="fylo-logos bg-blue-850 w-full md:w-1/2 p-10 pb-12  rounded-t-xl rounded-r-[80px] rounded-b-xl rounded-l-xl">  
        <div class="fylo-logo flex mt-4 justify-start">
        <img src="/images/logo.svg" alt="Fylo Logo">

        </div>
        <div class="fylo-icons flex gap-4 mt-8">
          <img class="bg-blue-950 p-3 rounded-xl" src="/images/icon-document.svg" alt="Icon Document">
          <img class="bg-blue-950 p-3 rounded-xl" src="/images/icon-folder.svg" alt="Icon Folder">
          <img class="bg-blue-950 p-3 rounded-xl" src="/images/icon-upload.svg" alt="Icon Upload">
        </div>
          

      </section>

      <section class="fylo-storage w-full flex-1  bg-blue-850 p-8 pb-20 rounded-xl   relative">
        <header>
          <h2 class="text-blue-200 text-sm text-center">You’ve used <span class="font-bold">815 GB </span>of your storage</h2>
        </header>
        <div class="progress-bar w-full h-4  bg-blue-950 rounded-full p-[2px] mt-4">
          <div class="progress w-[80%] h-full  rounded-full bg-gradient-to-r from-pink-300 to-pink-500 relative">
           <span class="absolute w-2.5 h-2.5 bg-white right-[2px] rounded-full top-1/2 -translate-y-1/2"></span>
          </div>

        </div>

      
         
          <div class="flex justify-between bt-4 mt-4">
            <p class="text-white text-sm font-bold">0 GB</p>
            <p class="text-white text-sm font-bold">1000 GB</p>
          </div>


          <div class="flex items-center gap-2 bg-white 
          absolute
          left-1/2 -translate-x-1/2 
           px-6 py-4 rounded-xl mt-6
           bottom-[-35px]
           md:left-auto
           md:right-8
           md:bottom-auto
           md:top-[-70px]
           md:translate-x-0"> 
          
            <div class="flex items-end font-bold">
            <span class="text-3xl leading-none">1</span>
            <span class="text-4xl leading-none">8</span>
           <span class="text-3xl leading-none">5</span>
           </div>
            <span class="text-[12px] font-bold text-gray-400 tracking-[0.2em] uppercase whitespace-nowrap">GB LEFT</span>
            
           
           </div>
        

      </section>
      
    </main>
   

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
